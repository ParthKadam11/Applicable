# Local / simple stack.
# NOTE: Postgres volume stays named `jobfit_pgdata` and DB creds stay `jobfit`
# so existing local data is not orphaned. Renaming the Docker volume would create
# an empty DB — dump/restore first if you ever want caniapply_* naming locally.
# Prod uses caniapply_* volumes (docker-compose.prod.yml).

services:
  postgres:
    image: postgres:16-alpine
    container_name: caniapply-postgres
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    # Host 5432 is already used by infra-postgres on this VPS.
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - jobfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit -d jobfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    container_name: caniapply-mcp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobfit:jobfit@postgres:5432/jobfit
      MCP_HTTP_PORT: "3100"
      MCP_RATE_LIMIT_RPM: "60"
      MCP_HTTP_ENTRY: "1"
      USER_AGENT: CaniApply/0.1 (+https://github.com/ParthKadam11/CaniApply; MCP)
    expose:
      - "3100"
    # Host 3100 is taken; nginx proxies mcp.parthkadam.tech → 3110.
    ports:
      - "127.0.0.1:3110:3100"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/health | grep -q '\"ok\":true'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: caniapply-caddy
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_HOST: ${MCP_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    profiles:
      - tls

volumes:
  # Intentionally kept as jobfit_pgdata — renaming orphans local data.
  jobfit_pgdata:
  caddy_data:
  caddy_config:
