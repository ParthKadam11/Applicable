services:
  postgres:
    image: postgres:16-alpine
    container_name: caniapply-postgres
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "5432:5432"
    volumes:
      - jobfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit -d jobfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    container_name: caniapply-mcp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobfit:jobfit@postgres:5432/jobfit
      MCP_HTTP_PORT: "3100"
      MCP_RATE_LIMIT_RPM: "60"
      MCP_HTTP_ENTRY: "1"
      USER_AGENT: CaniApply/0.1 (+https://github.com/ParthKadam11/CaniApply; MCP)
    expose:
      - "3100"
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/health | grep -q '\"ok\":true'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: caniapply-caddy
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:-mcp.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    profiles:
      - tls

volumes:
  jobfit_pgdata:
  caddy_data:
  caddy_config:
