# joinwaitlist.parthkadam.tech → Next.js web (PM2 applicable-web on :3010)
# Middleware rewrites / → /waitlist. After linking:
#   sudo certbot --nginx -d joinwaitlist.parthkadam.tech

server {
    server_name joinwaitlist.parthkadam.tech;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/joinwaitlist.parthkadam.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/joinwaitlist.parthkadam.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = joinwaitlist.parthkadam.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name joinwaitlist.parthkadam.tech;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}