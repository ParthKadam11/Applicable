# applicable.click → Next.js web (PM2 applicable-web on :3010)
# Enable: bash infra/nginx/enable-applicable-web.sh
# TLS: certbot --nginx -d applicable.click

server {
    server_name applicable.click www.applicable.click;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/applicable.click/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/applicable.click/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.applicable.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = applicable.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name applicable.click www.applicable.click;
    return 404; # managed by Certbot




}