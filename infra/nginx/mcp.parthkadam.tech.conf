# Legacy host → branded MCP. Prefer https://mcp.applicable.click

server {
    server_name mcp.parthkadam.tech;

    location / {
        return 301 https://mcp.applicable.click$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcp.parthkadam.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcp.parthkadam.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mcp.parthkadam.tech) {
        return 301 https://mcp.applicable.click$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name mcp.parthkadam.tech;
    return 404; # managed by Certbot
}
