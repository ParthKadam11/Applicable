# Production stack for a single Contabo VPS (Ubuntu + Docker).
# Usage:
#   cp .env.example .env   # fill secrets + MCP_HOST
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Public surface: Caddy :80/:443 only. Postgres and MCP stay on the internal network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: applicable-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applicable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-applicable}
    volumes:
      - applicable_pgdata:/var/lib/postgresql/data
    # Loopback only — host Next.js (PM2) needs DATABASE_URL for Auth.js upserts.
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-applicable} -d ${POSTGRES_DB:-applicable}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - applicable

  migrate:
    build: .
    container_name: applicable-migrate
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-applicable}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-applicable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure"
    networks:
      - applicable

  app:
    build: .
    container_name: applicable-app
    command: ["node", "dist/index.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-applicable}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-applicable}
      LLM_STATE_PATH: /data/.llm-state.json
    volumes:
      - applicable_appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - applicable

  mcp:
    build: .
    container_name: applicable-mcp
    command: ["node", "dist/mcp/http.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-applicable}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-applicable}
      MCP_HTTP_PORT: "3100"
      MCP_RATE_LIMIT_RPM: ${MCP_RATE_LIMIT_RPM:-60}
      USER_AGENT: ${USER_AGENT:-Applicable/0.1}
      # Auth secrets are consumed by the Next.js web app (Vercel), not this
      # container. Kept here so .env documents the full surface and compose
      # does not strip unknown keys from env_file.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # Published for host nginx (this VPS). Caddy profile is optional for dedicated boxes.
    expose:
      - "3100"
    ports:
      - "127.0.0.1:3110:3100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/health | grep -q '\"ok\":true'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - applicable

  # Only for a dedicated VPS with free :80/:443.
  # This Contabo box already runs host nginx — leave the profile off:
  #   docker compose -f docker-compose.prod.yml up -d --build
  # Dedicated box with Caddy:
  #   docker compose -f docker-compose.prod.yml --profile caddy up -d --build
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: applicable-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MCP_HOST: ${MCP_HOST:?MCP_HOST is required (e.g. mcp.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - applicable_caddy_data:/data
      - applicable_caddy_config:/config
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - applicable

networks:
  applicable:
    driver: bridge

volumes:
  applicable_pgdata:
  applicable_appdata:
  applicable_caddy_data:
  applicable_caddy_config:
