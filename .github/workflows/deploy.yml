name: Deploy

# Deploys to the Contabo VPS over SSH after CI on master/main.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          — e.g. 123.45.67.89 or mcp.yourdomain.com
#   VPS_USER          — SSH user (e.g. root or deploy)
#   VPS_SSH_KEY       — full private key INCLUDING BEGIN/END lines + real newlines
#   VPS_DEPLOY_PATH   — app dir on VPS (default /opt/caniapply)
#   MCP_SMOKE_URL     — e.g. https://mcp.yourdomain.com (optional; skips smoke if unset)

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Skip post-deploy smoke test"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate SSH key secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty. Paste the full private key (BEGIN…END) into repo Actions secrets."
            exit 1
          fi
          # Accept OpenSSH or PEM formats
          if ! printf '%s\n' "$VPS_SSH_KEY" | head -n1 | grep -qE 'BEGIN (OPENSSH |RSA |EC )?PRIVATE KEY'; then
            echo "::error::VPS_SSH_KEY does not look like a private key. You may have pasted the .pub file, or newlines were lost."
            echo "First line should be: -----BEGIN OPENSSH PRIVATE KEY----- (or BEGIN RSA PRIVATE KEY)"
            exit 1
          fi
          echo "VPS_SSH_KEY looks like a private key (header OK)"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          # Used on the VPS so `git fetch` works without interactive HTTPS login
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: GH_TOKEN,GH_REPO,GH_SHA,GH_REF_NAME
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/caniapply}"
            cd "$DEPLOY_PATH"

            echo "==> git status (before)"
            git rev-parse --short HEAD
            git status -sb

            echo "==> git fetch (token auth) ${GH_REF_NAME} @ ${GH_SHA}"
            # Avoid interactive HTTPS prompts on the VPS (common with https:// remotes)
            AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            git fetch --depth 1 "$AUTH_URL" "$GH_REF_NAME"
            git checkout -B "$GH_REF_NAME" FETCH_HEAD
            git reset --hard "$GH_SHA"
            git rev-parse --short HEAD

            echo "==> check .env (compose interpolation)"
            if [ ! -f .env ]; then
              echo "::error::Missing $DEPLOY_PATH/.env on the VPS. Copy from .env.example and set POSTGRES_PASSWORD + MCP_HOST."
              exit 1
            fi
            # shellcheck disable=SC1091
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            missing=""
            [ -n "${MCP_HOST:-}" ] || missing="$missing MCP_HOST"
            [ -n "${POSTGRES_PASSWORD:-}" ] || missing="$missing POSTGRES_PASSWORD"
            if [ -n "$missing" ]; then
              echo "ERROR: .env is missing required vars:$missing"
              echo "On the VPS: nano $DEPLOY_PATH/.env  # set MCP_HOST=mcp.yourdomain.com and POSTGRES_PASSWORD=..."
              exit 1
            fi
            echo "MCP_HOST=$MCP_HOST (ok)"

            echo "==> docker compose up"
            docker compose -f docker-compose.prod.yml up -d --build

            echo "==> wait for mcp healthy"
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml ps mcp | grep -qi healthy; then
                echo "mcp healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "mcp did not become healthy in time"
                docker compose -f docker-compose.prod.yml ps
                docker compose -f docker-compose.prod.yml logs --tail=80 mcp migrate
                exit 1
              fi
              sleep 2
            done

            echo "==> recent logs"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=40 migrate mcp app

            echo "==> deployed $(git rev-parse --short HEAD)"

      - name: Smoke test
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_smoke != 'true' }}
        env:
          SMOKE_URL: ${{ secrets.MCP_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_URL:-}" ]; then
            echo "MCP_SMOKE_URL secret not set — skipping smoke"
            exit 0
          fi
          URL="${SMOKE_URL%/}"
          echo "Smoke against $URL"

          curl -fsSL --max-time 30 "$URL/health" | grep -q '"ok":true'
          echo "PASS /health"

          INIT=$(curl -fsSL --max-time 30 -X POST "$URL/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"gha-smoke","version":"0.0.1"}}}')
          echo "$INIT" | grep -q caniapply
          echo "PASS initialize"

          STATS=$(curl -fsSL --max-time 30 -X POST "$URL/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"stats","arguments":{}}}')
          echo "$STATS" | grep -qE 'companies_active|tech_open_jobs'
          echo "PASS tools/call stats"
          echo "Smoke OK"
